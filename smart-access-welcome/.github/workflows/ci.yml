name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qtbase5-dev libqt5websockets5-dev \
            qtspeech5-dev libopencv-dev libopencv-contrib-dev
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSAW_BUILD_APPS=ON -DSAW_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
